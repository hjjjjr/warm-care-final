<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>益健堂｜中老年健康体验门店</title></head><body><script>
fetch('https://raw.githubusercontent.com/hjjjjr/warm-care-demo/222d971b5fcd5f9f4a01daa3128027dde4ea2d0b/index.html',{cache:'no-store'}).then(r=>r.text()).then(h=>{
const base='https://raw.githubusercontent.com/hjjjjr/warm-care-demo/main/assets/';
h=h.replaceAll('assets/p1.b64',base+'p1-fixed.b64').replaceAll('assets/p2.b64',base+'p2.b64').replaceAll('assets/p3.b64',base+'p3.b64').replaceAll('assets/p4.b64',base+'p4-fixed.b64').replaceAll('assets/p5.b64',base+'p5.b64').replaceAll('assets/p6.b64',base+'p6.b64');
h=h.replace('<h3>第一批开始体验</h3>','<h3 id="sessionTitle">第一场体验</h3>');
h=h.replace('<div class="slots reveal"><div class="slot"><b>06:00</b><span>体验场次</span></div><div class="slot"><b>07:00</b><span>体验场次</span></div><div class="slot"><b>08:00</b><span>体验场次</span></div><div class="slot"><b>09:00</b><span>体验场次</span></div><div class="slot"><b>10:00</b><span>体验场次</span></div><div class="slot"><b>11:00</b><span>体验场次</span></div><div class="slot"><b>14:00</b><span>体验场次</span></div><div class="slot"><b>15:00</b><span>体验场次</span></div><div class="slot"><b>16:00</b><span>体验场次</span></div></div>','<div class="slots reveal"><div class="slot"><b>06:00</b><span>第一场</span></div><div class="slot"><b>07:00</b><span>第二场</span></div><div class="slot"><b>08:00</b><span>第三场</span></div><div class="slot"><b>09:00</b><span>第四场</span></div><div class="slot"><b>10:00</b><span>第五场</span></div><div class="slot"><b>11:00</b><span>第六场</span></div><div class="slot"><b>14:00</b><span>第七场</span></div><div class="slot"><b>15:00</b><span>第八场</span></div><div class="slot"><b>16:00</b><span>第九场</span></div></div>');
const patch=`<script>(function(){const sessions=['第一场体验','第二场体验','第三场体验','第四场体验','第五场体验','第六场体验','第七场体验','第八场体验','第九场体验'];const times=['06:00','07:00','08:00','09:00','10:00','11:00','14:00','15:00','16:00'];
setTimeout(()=>{document.querySelectorAll('.time-chip').forEach((b,i)=>{b.onclick=()=>{document.querySelectorAll('.time-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=b.dataset.time||times[i];const at=document.getElementById('activeTime');if(at)at.textContent=t;const st=document.getElementById('sessionTitle');if(st)st.textContent=sessions[i];const tt=document.getElementById('timeText');if(tt)tt.textContent=(i<6?'上午分时体验场次。':'下午分时体验场次。')+' 按照当天安排取号入场，具体体验内容与名额以门店实际情况为准。';};});
document.querySelectorAll('.reserve-time').forEach((b,i)=>{b.textContent=times[i]+' · '+sessions[i].replace('体验','');});},0);})();<\/script>`;
h=h.replace('</body>',patch+'</body>');document.open();document.write(h);document.close();
}).catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:40px">页面加载失败，请刷新重试。</p>';console.error(e)});
</script></body></html>
